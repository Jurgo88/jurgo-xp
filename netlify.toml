[build]
  command = "npm run generate"
  # On Netlify, Nitro uses the netlify-static preset, which writes to dist/
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects live in public/_redirects: Nitro appends its "/* /404.html 404" catch-all
# to that file, and _redirects is evaluated before netlify.toml, so rules here never match.
