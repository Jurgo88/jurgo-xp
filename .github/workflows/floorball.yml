name: Refresh floorball stats

# Pulls fresh stats from legendarnaliga.sk and commits app/data/floorball.json
# when something changed. The push to main triggers a Netlify deploy.
# Matches are on weekends, so run on Monday and Thursday mornings.

on:
  schedule:
    - cron: '30 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floorball
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run floorball
      - name: Commit if changed
        run: |
          if git diff --quiet -- app/data/floorball.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add app/data/floorball.json
          git commit -m "chore: refresh floorball stats"
          git push
